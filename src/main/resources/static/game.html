<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大鱼吃小鱼</title>
  <style>
    :root {
      --bg1: #081826;
      --bg2: #123a58;
      --panel: rgba(255, 255, 255, 0.12);
      --text: #eaf7ff;
      --accent: #ffd166;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 15%, #2f7aa5 0%, var(--bg2) 40%, var(--bg1) 100%);
    }

    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    .top-bar {
      position: fixed;
      top: 18px;
      left: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 36px);
      padding-right: 140px;
      z-index: 50;
    }

    .hud {
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--panel);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 14px;
      user-select: none;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }

    .music-controls {
      position: fixed;
      top: 76px;
      right: 18px;
      width: 320px;
      max-width: calc(100vw - 36px);
      margin-top: 0;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: left;
      display: none;
      z-index: 50;
    }

    .control-btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-width: 84px;
      height: 40px;
      padding: 0 16px;
      border: 1px solid rgba(102, 187, 255, 0.75);
      border-radius: 6px;
      color: #dbeeff;
      background: rgba(6, 25, 44, 0.85);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
    }

    .control-btn:hover {
      background: rgba(14, 42, 65, 0.95);
    }

    .end-btn {
      border-color: rgba(255, 109, 106, 0.75);
      color: #ffb3b3;
      background: rgba(40, 8, 16, 0.72);
    }

    .end-btn:hover {
      background: rgba(64, 12, 24, 0.9);
    }

    .tag {
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.15);
      white-space: nowrap;
    }

    .mobile-tools {
      position: fixed;
      right: 12px;
      bottom: 12px;
      display: flex;
      gap: 8px;
      z-index: 30;
    }

    .mode-btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #12212f;
      background: linear-gradient(135deg, #ffd166 0%, #fcbf49 100%);
      cursor: pointer;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #b8ffd9 0%, #7fffd4 100%);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.42);
      text-align: center;
      padding: 20px;
      z-index: 40;
    }

    .overlay.show { display: flex; }

    .card {
      min-width: 280px;
      max-width: 420px;
      padding: 22px;
      border-radius: 14px;
      background: rgba(9, 29, 46, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      letter-spacing: 1px;
    }

    p { margin: 8px 0; }

    button {
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 700;
      color: #2c2200;
      background: linear-gradient(135deg, #ffd166 0%, #fcbf49 100%);
      cursor: pointer;
    }

    button:hover { filter: brightness(1.05); }

    .card-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .secondary-btn {
      color: #ffd166;
      background: rgba(3, 22, 42, 0.72);
      border: 1px solid rgba(255, 209, 102, 0.58);
    }

    .joystick {
      position: fixed;
      left: 16px;
      bottom: 18px;
      width: 126px;
      height: 126px;
      border-radius: 50%;
      z-index: 35;
      touch-action: none;
      display: none;
      user-select: none;
    }

    .joystick.show { display: block; }

    .stick-base {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(2px);
    }

    .stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54px;
      height: 54px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255, 209, 102, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.72);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
    }

    @media (max-width: 900px) {
      .hud {
        top: 8px;
        left: 8px;
        padding: 7px 8px;
        gap: 6px;
        font-size: 12px;
      }

      .mobile-tools {
        right: 8px;
        bottom: 8px;
      }

      .mode-btn {
        padding: 8px 10px;
        font-size: 12px;
      }

    }

    @media (orientation: portrait) and (max-width: 900px) {
      .top-bar {
        top: 10px;
        left: 10px;
        right: 10px;
        padding: 10px 12px;
        flex-wrap: wrap;
        gap: 8px;
        max-width: calc(100vw - 20px);
      }

      .top-actions {
        width: 100%;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
      }

      .control-btn {
        min-width: 68px;
        padding: 0 12px;
        font-size: 13px;
      }

      .leaderboard-btn,
      .logout-btn {
        right: 12px;
        padding: 0 12px;
        height: 36px;
        font-size: 13px;
      }

      .logout-btn {
        bottom: 56px;
      }

      .music-controls {
        width: calc(100vw - 20px);
        max-width: 360px;
        right: 10px;
        left: 10px;
      }

      .card {
        width: min(100%, 95vw);
        max-width: 360px;
        padding: 18px;
      }

      .card-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .card-actions button {
        width: 100%;
      }

      .account-row {
        grid-template-columns: 1fr;
      }

      .account-row button {
        width: 100%;
      }

      .music-mode-buttons {
        gap: 6px;
      }

      .music-mode-buttons button {
        min-width: 0;
        flex: 1;
      }
    }

    .leaderboard-btn,
    .logout-btn {
      z-index: 45;
    }

    .leaderboard-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      height: 40px;
      padding: 0 16px;
      border: 1px solid rgba(255, 209, 102, 0.6);
      border-radius: 6px;
      color: #ffd166;
      background: rgba(3, 22, 42, 0.72);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .leaderboard-btn:hover {
      background: rgba(8, 38, 70, 0.86);
    }

    .logout-btn {
      position: fixed;
      right: 18px;
      bottom: 68px;
      height: 40px;
      padding: 0 16px;
      border: 1px solid rgba(255, 109, 106, 0.75);
      border-radius: 6px;
      color: #ffb3b3;
      background: rgba(40, 8, 16, 0.72);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .logout-btn:hover {
      background: rgba(64, 12, 24, 0.9);
    }

    .account-panel {
      margin: 18px 0 0;
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .account-panel label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #ffd166;
    }

    .account-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .account-row select,
    .account-row button {
      min-height: 42px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 14px;
    }

    .account-row select {
      width: 100%;
      padding: 0 12px;
      color: #f3f8ff;
      background: rgba(1, 11, 20, 0.85);
      outline: none;
    }

    .account-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #c4e7ff;
      line-height: 1.45;
    }

    .music-panel-toggle {
      width: 100%;
      margin-top: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 209, 102, 0.5);
      background: rgba(3, 22, 42, 0.9);
      color: #ffd166;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
    }

    .music-controls.show {
      display: block;
    }

    .music-player-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 6px 0;
    }

    .music-play-pause-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,209,102,0.5);
      background: rgba(255,209,102,0.15);
      color: #ffd166;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
    }

    .music-play-pause-btn:hover {
      background: rgba(255,209,102,0.3);
    }

    .music-progress {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .music-progress span {
      min-width: 40px;
      font-size: 12px;
      color: #dcdcdc;
      text-align: center;
    }

    .music-progress input {
      flex: 1;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      appearance: none;
      outline: none;
    }

    .music-progress input::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffd166;
      cursor: pointer;
      border: none;
    }

    .music-progress input::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffd166;
      cursor: pointer;
      border: none;
    }

    .music-controls label,
    .music-controls p {
      margin: 6px 0;
      font-size: 13px;
      color: #dcdcdc;
    }

    .music-controls select,
    .music-controls button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 10px 12px;
      font-size: 14px;
      background: rgba(3, 22, 42, 0.95);
      color: #f7f9ff;
    }

    .music-mode-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .music-mode-buttons button {
      flex: 1;
      min-width: 30%;
      background: rgba(255, 255, 255, 0.08);
      color: #c9dfff;
    }

    .music-mode-buttons button.active {
      background: rgba(255, 209, 102, 0.95);
      color: #12212f;
    }

    .music-status {
      margin-top: 10px;
      font-size: 12px;
      color: #b9d2ff;
    }

    .music-search-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .music-search-row input {
      flex: 1;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.16);
      padding: 8px 10px;
      font-size: 13px;
      background: rgba(3,22,42,0.95);
      color: #f7f9ff;
      outline: none;
    }

    .music-search-row button {
      border-radius: 8px;
      border: 1px solid rgba(255,209,102,0.5);
      background: rgba(255,209,102,0.15);
      color: #ffd166;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
    }

    .music-search-row button:hover {
      background: rgba(255,209,102,0.3);
    }

    .music-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
    }

    .music-tabs button {
      flex: 1;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: #aac;
      padding: 6px 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .music-tabs button.active {
      background: rgba(255,209,102,0.2);
      color: #ffd166;
      border-color: rgba(255,209,102,0.3);
    }

    .music-track-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 8px;
      border-radius: 8px;
      background: rgba(0,0,0,0.2);
    }

    .music-track-list::-webkit-scrollbar {
      width: 4px;
    }

    .music-track-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }

    .music-track-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.15s;
    }

    .music-track-item:hover {
      background: rgba(255,255,255,0.06);
    }

    .music-track-item.active {
      background: rgba(255,209,102,0.12);
    }

    .music-track-item .track-info {
      flex: 1;
      min-width: 0;
    }

    .music-track-item .track-name {
      font-size: 13px;
      color: #f0f4ff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .music-track-item .track-artist {
      font-size: 11px;
      color: #8899bb;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .music-track-item .track-provider {
      font-size: 10px;
      color: #667;
    }

    .music-track-item .track-fav-btn {
      flex-shrink: 0;
      flex-grow: 0;
      width: 28px;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 0;
      line-height: 1;
      color: #667;
      transition: color 0.15s;
      text-align: center;
    }

    .music-track-item .track-fav-btn.favorited {
      color: #ff6b6b;
    }

    .music-track-item .track-fav-btn:hover {
      color: #ff6b6b;
    }

    .music-track-item .track-play-btn {
      flex-shrink: 0;
      flex-grow: 0;
      width: 52px;
      background: rgba(255,209,102,0.15);
      border: 1px solid rgba(255,209,102,0.3);
      border-radius: 6px;
      color: #ffd166;
      padding: 4px 0;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }

    .music-track-item .track-play-btn:hover {
      background: rgba(255,209,102,0.3);
    }

    .music-empty {
      padding: 20px;
      text-align: center;
      color: #667;
      font-size: 13px;
    }

    .music-loading {
      padding: 20px;
      text-align: center;
      color: #8899bb;
      font-size: 13px;
    }

    .leaderboard-modal {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,.65);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .leaderboard-modal.show {
      display: flex;
    }

    .leaderboard-modal-content {
      width: min(500px, 90vw);
      max-height: 80vh;
      overflow-y: auto;
      border-radius: 16px;
      border: 1px solid rgba(150, 215, 255, 0.24);
      background: rgba(3, 22, 42, 0.96);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.5);
      color: #eaf6ff;
    }

    .leaderboard-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      border-bottom: 1px solid rgba(150, 215, 255, 0.18);
      font-size: 20px;
      font-weight: 700;
      color: #ffd166;
    }

    .leaderboard-modal-header button {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      color: #eaf6ff;
      font-size: 20px;
      cursor: pointer;
      padding: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .leaderboard-modal-header button:hover {
      background: rgba(255,255,255,0.15);
    }

    #leaderboardModalBody {
      padding: 0;
    }

    #leaderboardModalBody table {
      width: 100%;
      border-collapse: collapse;
    }

    #leaderboardModalBody th,
    #leaderboardModalBody td {
      padding: 12px 18px;
      text-align: left;
      border-bottom: 1px solid rgba(150, 215, 255, 0.1);
    }

    #leaderboardModalBody th {
      color: #9fc9e8;
      font-size: 13px;
      background: rgba(1, 13, 26, 0.42);
    }

    #leaderboardModalBody td {
      font-size: 14px;
    }

    #leaderboardModalBody .rank {
      width: 60px;
      color: #ffd166;
      font-weight: 700;
    }

    #leaderboardModalBody .score {
      text-align: right;
      font-weight: 700;
    }

    .leaderboard-loading,
    .leaderboard-empty {
      padding: 34px 22px;
      text-align: center;
      color: #9fc9e8;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="top-bar">
    <div class="hud">
      <div class="tag">分数：<span id="score">0</span></div>
      <div class="tag">体型：<span id="size">20%</span></div>
      <div class="tag">血量：<span id="lives">♥♥♥</span></div>
    </div>
    <div class="top-actions">
      <button id="pauseBtn" class="control-btn" type="button">暂停</button>
      <button id="endBtn" class="control-btn end-btn" type="button">结束</button>
      <button id="musicBtn" class="control-btn" type="button" style="display:none;">音乐</button>
    </div>
  </div>
  <button id="leaderboardBtn" class="leaderboard-btn" type="button">排行榜</button>
  <button id="logoutBtn" class="logout-btn" type="button">登出</button>

  <div class="mobile-tools">
    <button id="modeBtn" class="mode-btn" type="button">横屏+转盘：关</button>
  </div>

  <div id="joystick" class="joystick" aria-hidden="true">
    <div class="stick-base"></div>
    <div id="stick" class="stick"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h1 id="title">大鱼吃小鱼</h1>
      <p id="msg">准备好开始了吗？</p>
          <div class="account-panel" id="accountPanel">
        <label for="accountSelect">快速切换账号</label>
        <div class="account-row">
          <select id="accountSelect">
            <option value="">选择已保存账号</option>
          </select>
          <button id="accountSwitchBtn" class="secondary-btn" type="button" disabled>登录</button>
        </div>
        <p id="accountHint" class="account-hint">如果已保存账号，可在此直接登录后开始游戏。</p>
      </div>
      <div class="card-actions">
        <button id="btn" type="button">开始游戏</button>
        <button id="uploadBtn" class="secondary-btn" type="button" style="display:none">上传分数</button>
        <button id="overlayLeaderboardBtn" class="secondary-btn" type="button">排行榜</button>
      </div>
    </div>
  </div>

    <div class="music-controls" id="musicControls">
      <div class="music-track-list" id="musicTrackList">
        <div class="music-loading">加载歌单中...</div>
      </div>
      <audio id="musicAudioPlayer" preload="auto" style="display:none;"></audio>
    <div class="music-player-bar">
        <button id="musicPlayPauseBtn" type="button" class="music-play-pause-btn">▶</button>
        <div class="music-progress">
          <span id="musicCurrentTime">00:00</span>
          <input id="musicProgress" type="range" min="0" max="100" step="0.1" value="0" />
          <span id="musicTotalTime">00:00</span>
        </div>
      </div>
      <div class="music-mode-buttons">
        <button id="modeSequential" type="button" class="active">顺序</button>
        <button id="modeRandom" type="button">随机</button>
        <button id="modeLoop" type="button">循环</button>
      </div>
      <p class="music-status" id="musicStatus"></p>
    </div>

    <div class="leaderboard-modal" id="leaderboardModal">
      <div class="leaderboard-modal-content">
        <div class="leaderboard-modal-header">
          <span>🏆 排行榜 Top 20</span>
          <button id="closeLeaderboardBtn">×</button>
        </div>
        <div id="leaderboardModalBody">

    async function renderLeaderboard() {

    // ── Music System (Fixed Audio Player) ──
    let currentPlaylist = [];
    let currentTrackIndex = 0;

    let musicPlaying = false;
    let isLoadingTrack = false;
    let errorCount = 0;
    let playGen = 0;
    let playlistLoaded = false;
    let loadingTimer = null;
    const audioPlayer = document.getElementById('musicAudioPlayer');
    const MUSIC_STATE_KEY = 'fishgameMusicState';

    const FALLBACK_PLAYLIST = [
      { id:'fb_1',  title:'Anomalous Spectrum',                         artist:'Camilo Forero',                         cover:'', provider:'local', mediaId:'/music/Camilo Forero - Anomalous Spectrum.mp3', keyword:'' },

      { id:'fb_3',  title:'Clear Skies Beyond the Storm',               artist:'Eugenio Izzi',                          cover:'', provider:'local', mediaId:'/music/eugenio izzi - Clear skies beyond the storm_H.ogg', keyword:'' },
      { id:'fb_4',  title:'You Ballin In The Wrong Neighborhood',       artist:'Exsire',                                cover:'', provider:'local', mediaId:'/music/Exsire - You Ballin In The Wrong Neighborhood (No Jumpscare Ending since a lot of people asked me to release a version without ballin at the end, so here it is)_H.mp4', keyword:'' },
      { id:'fb_5',  title:'Misty Memory (Night Version)',               artist:'Elvin Shen, ZT, Erik Castro, David Lin', cover:'', provider:'local', mediaId:'/music/Misty Memory (Night Version).ogg', keyword:'' },
      { id:'fb_6',  title:'Aruarian Dance',                             artist:'Nujabes, Fat Jon',                      cover:'', provider:'local', mediaId:'/music/Nujabes _ Fat Jon - Aruarian Dance.mp3', keyword:'' },
      { id:'fb_7',  title:'Vstrechnaya',                                artist:'Peremotka',                             cover:'', provider:'local', mediaId:'/music/Peremotka - Vstrechnaya.ogg', keyword:'' },
      { id:'fb_8',  title:'Epilogue',                                   artist:'SHIKI',                                 cover:'', provider:'local', mediaId:'/music/SHIKI - Epilogue.ogg', keyword:'' },
      { id:'fb_9',  title:'Time Paradox',                               artist:'Bub8les, RazorFrost, Rare',             cover:'', provider:'local', mediaId:'/music/Time Paradox.mp3', keyword:'' },

      { id:'fb_11', title:'My Castle Town',                             artist:'Toby Fox',                              cover:'', provider:'local', mediaId:'/music/Toby Fox - My Castle Town_L.ogg', keyword:'' },
      { id:'fb_12', title:'Eternal Breath',                             artist:'YU',                                    cover:'', provider:'local', mediaId:'/music/YU - Eternal Breath.mp3', keyword:'' }
    ];

    function setMusicMode(mode) {
      musicMode = mode;
      modeSequential.classList.toggle('active', mode === 'sequential');
      modeRandom.classList.toggle('active', mode === 'random');
      modeLoop.classList.toggle('active', mode === 'loop');
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '00:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateProgress() {
      if (!audioPlayer || !audioPlayer.duration) return;
      const d = audioPlayer.duration;
      const ct = audioPlayer.currentTime;
      if (d > 0 && Number.isFinite(d)) {
        musicProgress.max = String(d);
        musicProgress.value = String(ct);
        musicCurrentTime.textContent = formatTime(ct);
        musicTotalTime.textContent = formatTime(d);
      }
    }

    let progressInterval = null;

    function startProgressPolling() {
      stopProgressPolling();
      progressInterval = setInterval(updateProgress, 500);
    }

    function stopProgressPolling() {
      if (progressInterval) {
        clearInterval(progressInterval);
        progressInterval = null;
      }
    }

    function applyPlaylist(list) {
      currentPlaylist = list;
      errorCount = 0;
      playlistLoaded = true;
      if (loadingTimer) { clearTimeout(loadingTimer); loadingTimer = null; }
      renderTrackList();
      musicStatus.textContent = `共 ${currentPlaylist.length} 首歌曲`;
      try {
        const saved = localStorage.getItem(MUSIC_STATE_KEY);
        if (saved) {
          const state = JSON.parse(saved);
          setMusicMode(state.musicMode || 'sequential');
          if (state.trackIndex != null && state.trackIndex < currentPlaylist.length) {
            currentTrackIndex = state.trackIndex;
            renderTrackList();
          }
        }
      } catch (e) {}
    }

    async function loadPlaylist() {
      loadingTimer = setTimeout(() => {
        if (!playlistLoaded) {
          musicStatus.textContent = '加载超时，使用默认播放列表';
          applyPlaylist(FALLBACK_PLAYLIST);
        }
      }, 5000);
      try {
        const res = await fetch('/api/music/playlist');
        const data = await res.json();
        if (data.code === 200 && data.data && data.data.length > 0) {
          applyPlaylist(data.data);
          return;
        }
      } catch (e) {}
      if (!playlistLoaded) {
        musicStatus.textContent = '歌单加载失败，使用默认播放列表';
        applyPlaylist(FALLBACK_PLAYLIST);
      }
    }

    function renderTrackList() {
      const playingId = currentPlaylist[currentTrackIndex]?.id;
      let html = '';
      currentPlaylist.forEach((track, idx) => {
        const isActive = track.id === playingId;
        html += `
          <div class="music-track-item${isActive ? ' active' : ''}" data-index="${idx}">
            <div class="track-info">
              <div class="track-name">${escHtml(track.title)}</div>
              <div class="track-artist">${escHtml(track.artist)}</div>
            </div>
            <button class="track-play-btn" data-action="play">${isActive ? '▶' : '播放'}</button>
          </div>`;
      });
      musicTrackList.innerHTML = html || '<div class="music-empty">暂无可用音乐</div>';

      musicTrackList.querySelectorAll('[data-action="play"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const div = btn.closest('.music-track-item');
          const idx = parseInt(div.dataset.index, 10);
          if (!isNaN(idx)) playTrack(idx);
        });
      });
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function getAudioPath(src) {
      try { return new URL(src).pathname; } catch(e) { return src; }
    }

    function playTrack(index) {
      if (!currentPlaylist || currentPlaylist.length === 0 || index < 0 || index >= currentPlaylist.length) return;
      if (isLoadingTrack) return;
      currentTrackIndex = index;
      const track = currentPlaylist[currentTrackIndex];
      if (!track || !track.mediaId) {
        musicStatus.textContent = '歌曲信息不完整';
        return;
      }

      const gen = ++playGen;
      isLoadingTrack = true;
      const url = track.mediaId;

      const currentPath = getAudioPath(audioPlayer.src);
      if (currentPath !== url) {
        audioPlayer.pause();
        audioPlayer.src = url;
      }

      audioPlayer.play().then(() => {
        if (gen !== playGen) return;
        musicPlaying = true;
        errorCount = 0;
        musicStatus.textContent = `正在播放：${track.title} - ${track.artist}`;
        musicPlayPauseBtn.textContent = '⏸';
        startProgressPolling();
      }).catch(() => {
        if (gen !== playGen) return;
        musicPlaying = false;
        musicStatus.textContent = `播放失败：${track.title}`;
      }).finally(() => {
        if (gen !== playGen) return;
        isLoadingTrack = false;
      });

      renderTrackList();
      saveMusicState();
    }

    function toggleMusicPause() {
      if (musicPlaying) {
        audioPlayer.pause();
        musicPlaying = false;
        musicPlayPauseBtn.textContent = '▶';
        stopProgressPolling();
        musicStatus.textContent = '已暂停';
      } else {
        audioPlayer.play().then(() => {
          musicPlaying = true;
          musicPlayPauseBtn.textContent = '⏸';
          startProgressPolling();
          const track = currentPlaylist[currentTrackIndex];
          if (track) musicStatus.textContent = `继续播放：${track.title}`;
        }).catch(() => {
          musicPlaying = false;
          musicPlayPauseBtn.textContent = '▶';
        });
      }
      saveMusicState();
    }

    musicPlayPauseBtn.addEventListener('click', toggleMusicPause);

    audioPlayer.addEventListener('ended', () => {
      musicPlaying = false;
      musicPlayPauseBtn.textContent = '▶';
      stopProgressPolling();
      if (currentPlaylist.length === 0) return;
      let next;
      if (musicMode === 'loop') {
        next = currentTrackIndex;
      } else if (musicMode === 'random') {
        next = Math.floor(Math.random() * currentPlaylist.length);
        if (next === currentTrackIndex && currentPlaylist.length > 1) {
          next = (currentTrackIndex + 1) % currentPlaylist.length;
        }
      } else {
        next = (currentTrackIndex + 1) % currentPlaylist.length;
      }
      playTrack(next);
    });

    audioPlayer.addEventListener('error', () => {
      musicPlaying = false;
      musicPlayPauseBtn.textContent = '▶';
      stopProgressPolling();
      errorCount++;
      if (errorCount >= currentPlaylist.length) {
        musicStatus.textContent = '所有歌曲暂时无法播放，请检查音乐文件是否缺失';
        return;
      }
      musicStatus.textContent = `播放出错 (${errorCount}/${currentPlaylist.length})，尝试下一首...`;
      isLoadingTrack = false;
      if (currentPlaylist.length > 0) {
        const next = (currentTrackIndex + 1) % currentPlaylist.length;
        playTrack(next);
      }
    });

    musicProgress.addEventListener('input', (e) => {
      const val = Number(e.target.value);
      if (!Number.isNaN(val) && audioPlayer.duration) {
        audioPlayer.currentTime = val;
      }
    });

    function saveMusicState() {
      const state = {
        trackIndex: currentTrackIndex,
        currentTime: audioPlayer.currentTime || 0,
        musicMode: musicMode,
        isPlaying: !audioPlayer.paused

      localStorage.setItem(MUSIC_STATE_KEY, JSON.stringify(state));

    function clearMusicState() {
      localStorage.removeItem(MUSIC_STATE_KEY);

    function updateMusicPanelPosition() {
      const rect = musicBtn.getBoundingClientRect();
      const panelWidth = musicControls.offsetWidth || 320;
      const left = Math.min(Math.max(10, rect.left), window.innerWidth - panelWidth - 10);
      musicControls.style.left = `${left}px`;
      musicControls.style.top = `${Math.min(window.innerHeight - musicControls.offsetHeight - 10, rect.bottom + 8)}px`;
      musicControls.style.right = 'auto';
    }

    function toggleMusicPanel() {
      const showing = musicControls.classList.toggle('show');
      musicBtn.textContent = showing ? '关闭音乐' : '音乐';
      if (showing) {
        updateMusicPanelPosition();
        if (currentPlaylist.length === 0) loadPlaylist();
      }
    }

    window.addEventListener('resize', () => {
      if (musicControls.classList.contains('show')) {
        updateMusicPanelPosition();
      }
    });

    musicBtn.addEventListener('click', toggleMusicPanel);

    musicProgress.addEventListener('input', (e) => {
      const val = Number(e.target.value);
      if (!Number.isNaN(val) && audioPlayer.duration) {
        audioPlayer.currentTime = val;
      }
    });

    modeSequential.addEventListener('click', () => setMusicMode('sequential'));
    modeRandom.addEventListener('click', () => setMusicMode('random'));
    modeLoop.addEventListener('click', () => setMusicMode('loop'));

    accountSelect.addEventListener('change', () => {
      accountSwitchBtn.disabled = !accountSelect.value;
      if (accountSelect.value) {
        accountHint.textContent = `准备登录：${accountSelect.value}`;
      } else {
        const active = localStorage.getItem('username');
        accountHint.textContent = active

          : '如果已保存账号，可在此直接登录后开始游戏。';

    accountSwitchBtn.addEventListener('click', async () => {
      const selected = accountSelect.value;
      if (!selected) return;
      const savedAccounts = loadSavedAccounts();
      const account = savedAccounts.find((item) => item.username === selected);
      if (!account) {
        accountHint.textContent = '未找到已保存账号，请在登录页重新登录一次。';
        return;
      }

      accountSwitchBtn.disabled = true;
      accountHint.textContent = `正在登录 ${selected}...`;
      try {
        await login(account.username, account.password);
        accountHint.textContent = `已登录：${account.username}，现在可直接开始游戏。`;
      } catch (err) {
        accountHint.textContent = err.message || '登录失败，请检查账号信息。';
      } finally {
        accountSwitchBtn.disabled = false;
      }
    });

    overlayLeaderboardBtn.addEventListener('click', openLeaderboard);

    const player = {
      x: state.width * 0.5,
      y: state.height * 0.5,
      r: 22,
      speed: 2.5,
      color: '#ffe08a'
    };

    function resize() {
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(state.width * dpr);
      canvas.height = Math.floor(state.height * dpr);
      canvas.style.width = state.width + 'px';
      canvas.style.height = state.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function loadSavedAccounts() {
      try {
        return JSON.parse(localStorage.getItem('savedAccounts')) || [];
      } catch (err) {
        return [];
      }
    }

    function renderAccountSwitcher() {
      const accounts = loadSavedAccounts();
      if (!accounts.length) {
        accountPanel.style.display = 'none';
        return;
      }

      accountPanel.style.display = 'block';
      const currentUser = localStorage.getItem('username');
      accountSelect.innerHTML = [
        '<option value="">选择已保存账号</option>',
        ...accounts.map((account) => `
          <option value="${account.username}">${account.username}</option>
        `)
      ].join('');
      accountSwitchBtn.disabled = true;
      accountHint.textContent = currentUser
        ? `当前账号：${currentUser}。选择已保存账号即可快速切换。`
        : '如果已保存账号，可在此直接登录后开始游戏。';
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function dist2(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return dx * dx + dy * dy;
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function spawnFish() {
      if (!state.running) return;
      const maxFishOnScreen = 12;
      if (state.fish.length >= maxFishOnScreen) return;

      const side = Math.floor(Math.random() * 4);
      const spawnShark = state.score >= 350 && Math.random() < 0.18;
      const minR = spawnShark ? player.r * 0.9 : Math.max(7, player.r * 0.28);
      const maxR = spawnShark ? player.r * 1.15 : Math.max(14, player.r * 1.08);
      const r = rand(minR, maxR);
      const speed = clamp(rand(0.45, 0.95) * (24 / Math.max(18, r)), 0.38, 0.95);
      const drift = clamp(speed * 0.45, 0.16, 0.34);
      let x;
      let y;
      let vx;
      let vy;

      if (side === 0) {
        x = -r;
        y = rand(0, state.height);
        vx = speed;
        vy = rand(-drift, drift);
      } else if (side === 1) {
        x = state.width + r;
        y = rand(0, state.height);
        vx = -speed;
        vy = rand(-drift, drift);
      } else if (side === 2) {
        x = rand(0, state.width);
        y = -r;
        vx = rand(-drift, drift);
        vy = speed;
      } else {
        x = rand(0, state.width);
        y = state.height + r;
        vx = rand(-drift, drift);
        vy = -speed;
      }

      state.fish.push({
        x,
        y,
        r,
        vx,
        vy,
        hue: Math.floor(rand(0, 360)),
        wiggle: rand(0, Math.PI * 2),
        type: spawnShark ? 'shark' : fishTypes[Math.floor(rand(0, fishTypes.length))]
      });
    }

    function spawnBubble() {
      if (state.bubbles.length > 60) return;
      state.bubbles.push({
        x: rand(0, state.width),
        y: state.height + rand(0, 150),
        r: rand(1.5, 5),
        vy: rand(0.3, 1.3),
        alpha: rand(0.15, 0.45)
      });
    }

    function movePlayer() {
      const baseSpeed = player.speed * clamp(24 / Math.max(24, player.r), 0.8, 1);
      const joystickScale = state.mobileMode ? 0.88 : 1;
      const s = baseSpeed * joystickScale;
      const joy = state.joystick;

      if (state.mobileMode && (Math.abs(joy.inputX) > 0.05 || Math.abs(joy.inputY) > 0.05)) {
        player.x += joy.inputX * s;
        player.y += joy.inputY * s;
        state.targetX = player.x;
        state.targetY = player.y;
      } else {
        const left = state.keys.a || state.keys.arrowleft;
        const right = state.keys.d || state.keys.arrowright;
        const up = state.keys.w || state.keys.arrowup;
        const down = state.keys.s || state.keys.arrowdown;
        const hasKeyboardInput = left || right || up || down;

        if (hasKeyboardInput) {
          let inputX = (right ? 1 : 0) - (left ? 1 : 0);
          let inputY = (down ? 1 : 0) - (up ? 1 : 0);
          const inputLen = Math.hypot(inputX, inputY);
          if (inputLen > 0) {
            inputX /= inputLen;
            inputY /= inputLen;
            player.x += inputX * s;
            player.y += inputY * s;
            state.targetX = player.x;
            state.targetY = player.y;
          }
        } else {
          const dx = state.targetX - player.x;
          const dy = state.targetY - player.y;
          const d = Math.hypot(dx, dy);
          if (d > 0.1) {
            player.x += (dx / d) * Math.min(d, s);
            player.y += (dy / d) * Math.min(d, s);
          }
        }
      }

      player.x = clamp(player.x, player.r, state.width - player.r);
      player.y = clamp(player.y, player.r, state.height - player.r);
    }

    function updateFish() {
      for (let i = state.fish.length - 1; i >= 0; i--) {
        const f = state.fish[i];
        f.x += f.vx;
        f.y += f.vy;
        f.wiggle += 0.12;

        if (f.x < -100 || f.x > state.width + 100 || f.y < -100 || f.y > state.height + 100) {
          state.fish.splice(i, 1);
          continue;
        }

        const threshold = player.r + f.r;
        const hit = dist2(player, f) <= threshold * threshold;
        if (!hit) continue;

        if (player.r >= f.r * 1.02) {
          state.score += scoreForFish(f);
          const area = player.r * player.r + f.r * f.r * 0.08;
          player.r = Math.min(110, Math.sqrt(area));
          state.fish.splice(i, 1);
        } else if (performance.now() >= state.invincibleUntil) {
          state.lives -= 1;
          state.invincibleUntil = performance.now() + 900;
          renderHud();
          if (state.lives <= 0) {
            endGame();
            return;
          }
        }
      }
    }

    function scoreForFish(f) {
      if (f.type === 'shark') {
        return Math.max(12, Math.floor(f.r / 3));
      }
      return Math.max(1, Math.floor((f.r - 7) / 8) + 1);
    }

    function updateBubbles() {
      for (let i = state.bubbles.length - 1; i >= 0; i--) {
        const b = state.bubbles[i];
        b.y -= b.vy;
        if (b.y < -20) state.bubbles.splice(i, 1);
      }
    }

    function drawNpcFish(f) {
      const facing = f.vx >= 0 ? 1 : -1;
      const r = f.r;

      ctx.save();
      ctx.translate(f.x, f.y);
      if (facing < 0) ctx.scale(-1, 1);
      drawSpriteFish(fishSprites[f.type] || fishSprites.round, r * 2.9, r * 1.8);
      ctx.restore();
    }

    function drawPlayerFish() {
      const keyboardDirX = (state.keys.d || state.keys.arrowright ? 1 : 0)
        - (state.keys.a || state.keys.arrowleft ? 1 : 0);
      const dirX = keyboardDirX !== 0
        ? keyboardDirX
        : state.mobileMode && Math.abs(state.joystick.inputX) > 0.05
          ? state.joystick.inputX
          : state.targetX - player.x;
      const facing = dirX >= 0 ? 1 : -1;
      const r = player.r;

      ctx.save();
      ctx.translate(player.x, player.y);
      if (facing < 0) ctx.scale(-1, 1);
      drawSpriteFish(playerFishSprite, r * 2.8, r * 2.25);
      ctx.restore();
    }

    function drawSpriteFish(sprite, width, height) {
      if (!fishImage || !fishImage.complete || !fishImage.naturalWidth) return;
      ctx.drawImage(
        fishImage,
        sprite.x,
        sprite.y,
        sprite.width,
        sprite.height,
        -width / 2,
        -height / 2,
        width,
        height
      );
    }

    function draw() {
      ctx.clearRect(0, 0, state.width, state.height);

      for (const b of state.bubbles) {
        ctx.fillStyle = `rgba(214,245,255,${b.alpha})`;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const f of state.fish) {
        drawNpcFish(f);
      }

      drawPlayerFish();
    }

    let _hudScore = -1;
    let _hudR = -1;
    let _hudLives = '';
    function renderHud() {
      const sc = state.score;
      const r = player.r;
      const lives = '♥'.repeat(Math.max(0, state.lives));
      if (sc !== _hudScore) {
        scoreEl.textContent = String(sc);
        _hudScore = sc;
      }
      if (Math.abs(r - _hudR) > 0.05) {
        const pct = Math.min(100, Math.round((r / 110) * 100));
        sizeEl.textContent = pct + '%';
        _hudR = r;
      }
      if (lives !== _hudLives) {
        livesEl.textContent = lives;
        _hudLives = lives;
      }
    }

    function resetGame() {
      state.score = 0;
      state.lives = 3;
      state.invincibleUntil = 0;
      state.spawnTick = 0;
      state.fish = [];
      state.bubbles = [];
      Object.keys(state.keys).forEach((key) => { state.keys[key] = false; });
      resetJoystick();
      player.r = 22;
      player.x = state.width * 0.5;
      player.y = state.height * 0.5;
      state.targetX = player.x;
      state.targetY = player.y;
      renderHud();
    }

    function startGame() {
      resetGame();
      state.paused = false;
      pauseBtn.textContent = '暂停';
      state.running = true;
      musicBtn.style.display = 'inline-flex';
      uploadBtn.style.display = 'none';
      uploadBtn.style.color = '';
      uploadBtn.disabled = false;
      overlay.classList.remove('show');
    }

    function endGame() {
      state.running = false;
      titleEl.textContent = '游戏结束';
      msgEl.innerHTML = `最终分数：<b>${state.score}</b><br>当前体型：<b>${player.r.toFixed(1)}</b>`;
      const token = localStorage.getItem('token');

      const finalScore = state.score;
      const currentSize = player.r.toFixed(1);
      btn.textContent = '再来一局';
      overlayLeaderboardBtn.textContent = '排行榜';
      overlayLeaderboardBtn.style.display = 'inline-flex';
      btn.disabled = false;
      overlayLeaderboardBtn.disabled = false;
      musicBtn.style.display = 'inline-flex';
      btn.onclick = startGame;
      overlayLeaderboardBtn.onclick = openLeaderboard;

      if (token) {
        uploadBtn.style.display = '';
        uploadBtn.textContent = '上传分数';
        uploadBtn.disabled = false;
        uploadBtn.style.color = '';
      } else {
        titleEl.textContent = '游戏结束';
        msgEl.innerHTML = `最终分数：<b>${finalScore}</b><br>当前体型：<b>${currentSize}</b><br>未登录时分数不会上传，登录后可上传。`;
        uploadBtn.style.display = 'none';
      }

      renderAccountSwitcher();
      overlay.classList.add('show');
    }

    function showNormalStartOverlay() {
      titleEl.textContent = '大鱼吃小鱼';
      msgEl.textContent = '准备好开始了吗？';
      renderAccountSwitcher();
      musicControls.classList.remove('show');
      musicBtn.style.display = 'inline-flex';
      btn.disabled = false;
      btn.textContent = '开始游戏';
      uploadBtn.style.display = 'none';
      uploadBtn.style.color = '';
      uploadBtn.disabled = false;
      overlay.classList.add('show');
    }

    function loop() {
      if (document.hidden) {
        requestAnimationFrame(loop);
        return;
      }
      if (state.running && !state.paused) {
        state.spawnTick -= 1;
        if (state.spawnTick <= 0) {
          spawnFish();
          const cappedLv = Math.min(Math.floor(state.score / 25), 15);
          const baseMin = Math.max(16, 40 - cappedLv * 1.5);
          state.spawnTick = Math.floor(rand(baseMin, baseMin + 18));
        }
        if (Math.random() < 0.35) spawnBubble();

        movePlayer();
        updateFish();
        updateBubbles();
        renderHud();
      } else if (!state.running) {
        updateBubbles();
        if (Math.random() < 0.2) spawnBubble();
      }

      draw();
      requestAnimationFrame(loop);
    }

    function setTarget(clientX, clientY) {
      state.targetX = clamp(clientX, 0, state.width);
      state.targetY = clamp(clientY, 0, state.height);
    }

    function resetJoystick() {
      state.joystick.engaged = false;
      state.joystick.pointerId = null;
      state.joystick.inputX = 0;
      state.joystick.inputY = 0;
      stickEl.style.transform = 'translate(-50%, -50%)';
    }

    function updateJoystickFromPoint(clientX, clientY) {
      const rect = joystickEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const d = Math.hypot(dx, dy);
      const maxR = state.joystick.maxRadius;

      let nx = 0;
      let ny = 0;
      let drawX = 0;
      let drawY = 0;

      if (d > 0.0001) {
        const use = Math.min(d, maxR);
        nx = dx / d;
        ny = dy / d;
        drawX = nx * use;
        drawY = ny * use;
      }

      state.joystick.inputX = Math.max(-1, Math.min(1, drawX / maxR));
      state.joystick.inputY = Math.max(-1, Math.min(1, drawY / maxR));
      stickEl.style.transform = `translate(calc(-50% + ${drawX}px), calc(-50% + ${drawY}px))`;
    }

    function setMobileMode(on) {
      state.mobileMode = on;
      document.body.classList.toggle('mobile-mode', on);
      modeBtn.classList.toggle('active', on);
      modeBtn.textContent = on ? '横屏+转盘：开' : '横屏+转盘：关';
      joystickEl.classList.toggle('show', on);
      if (!on) resetJoystick();
    }

    async function requestLandscapeAndFullscreen() {
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {
      }

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (e) {
      }
    }

    window.addEventListener('mousemove', (e) => {
      if (!state.mobileMode) setTarget(e.clientX, e.clientY);
    });

    window.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (!t) return;
      if (state.mobileMode) return;
      setTarget(t.clientX, t.clientY);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if (!t) return;
      if (state.mobileMode) return;
      setTarget(t.clientX, t.clientY);
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (Object.prototype.hasOwnProperty.call(state.keys, key)) {
        state.keys[key] = true;
      }
      if (key.startsWith('arrow')) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (Object.prototype.hasOwnProperty.call(state.keys, key)) {
        state.keys[key] = false;
      }
    });

    joystickEl.addEventListener('pointerdown', (e) => {
      if (!state.mobileMode) return;
      state.joystick.engaged = true;
      state.joystick.pointerId = e.pointerId;
      joystickEl.setPointerCapture(e.pointerId);
      updateJoystickFromPoint(e.clientX, e.clientY);
      e.preventDefault();
    });

    joystickEl.addEventListener('pointermove', (e) => {
      if (!state.mobileMode) return;
      if (!state.joystick.engaged || state.joystick.pointerId !== e.pointerId) return;
      updateJoystickFromPoint(e.clientX, e.clientY);
      e.preventDefault();
    });

    function releaseJoystick(e) {
      if (!state.joystick.engaged || state.joystick.pointerId !== e.pointerId) return;
      resetJoystick();
    }

    joystickEl.addEventListener('pointerup', releaseJoystick);
    joystickEl.addEventListener('pointercancel', releaseJoystick);
    joystickEl.addEventListener('pointerleave', releaseJoystick);

    window.addEventListener('blur', () => {
      Object.keys(state.keys).forEach((key) => { state.keys[key] = false; });
      resetJoystick();
    });

    window.addEventListener('resize', resize);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        Object.keys(state.keys).forEach((key) => { state.keys[key] = false; });
        resetJoystick();
      }
    });

    modeBtn.addEventListener('click', async () => {
      const next = !state.mobileMode;
      setMobileMode(next);
      if (next) await requestLandscapeAndFullscreen();
    });

    btn.onclick = startGame;

    uploadBtn.addEventListener('click', async function () {
      this.disabled = true;
      this.textContent = '上传中...';
      try {
        await uploadScore(state.score);
        this.textContent = '✓ 上传成功';
        this.style.color = '#b8ffd9';
      } catch (err) {
        this.textContent = err.message || '上传失败，点击重试';
        this.disabled = false;
      }
    });

    if (!isTouchDevice) {
      modeBtn.style.display = 'none';
    }
    setMobileMode(false);
    setMusicMode('sequential');
    loadPlaylist();
    showNormalStartOverlay();
    resize();
    renderHud();
    loop();

    window.addEventListener('beforeunload', saveMusicState);
  </script>
</body>
</html>
