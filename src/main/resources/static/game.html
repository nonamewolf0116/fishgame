<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大鱼吃小鱼</title>
  <style>
    :root {
      --bg1: #081826;
      --bg2: #123a58;
      --panel: rgba(255, 255, 255, 0.12);
      --text: #eaf7ff;
      --accent: #ffd166;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 15%, #2f7aa5 0%, var(--bg2) 40%, var(--bg1) 100%);
    }

    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    .hud {
      position: fixed;
      top: 68px;
      left: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: var(--panel);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 14px;
      user-select: none;
      z-index: 20;
    }

    .top-actions {
      position: fixed;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 8px;
      z-index: 20;
    }

    .control-btn {
      height: 40px;
      padding: 0 16px;
      border: 1px solid rgba(102, 187, 255, 0.75);
      border-radius: 6px;
      color: #dbeeff;
      background: rgba(6, 25, 44, 0.85);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .control-btn:hover {
      background: rgba(14, 42, 65, 0.95);
    }

    .end-btn {
      border-color: rgba(255, 109, 106, 0.75);
      color: #ffb3b3;
      background: rgba(40, 8, 16, 0.72);
    }

    .end-btn:hover {
      background: rgba(64, 12, 24, 0.9);
    }

    .tag {
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.15);
      white-space: nowrap;
    }

    .mobile-tools {
      position: fixed;
      right: 12px;
      bottom: 12px;
      display: flex;
      gap: 8px;
      z-index: 30;
    }

    .mode-btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #12212f;
      background: linear-gradient(135deg, #ffd166 0%, #fcbf49 100%);
      cursor: pointer;
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #b8ffd9 0%, #7fffd4 100%);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.42);
      text-align: center;
      padding: 20px;
      z-index: 40;
    }

    .overlay.show { display: flex; }

    .card {
      min-width: 280px;
      max-width: 420px;
      padding: 22px;
      border-radius: 14px;
      background: rgba(9, 29, 46, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      letter-spacing: 1px;
    }

    p { margin: 8px 0; }

    button {
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 700;
      color: #2c2200;
      background: linear-gradient(135deg, #ffd166 0%, #fcbf49 100%);
      cursor: pointer;
    }

    button:hover { filter: brightness(1.05); }

    .card-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .secondary-btn {
      color: #ffd166;
      background: rgba(3, 22, 42, 0.72);
      border: 1px solid rgba(255, 209, 102, 0.58);
    }

    .joystick {
      position: fixed;
      left: 16px;
      bottom: 18px;
      width: 126px;
      height: 126px;
      border-radius: 50%;
      z-index: 35;
      touch-action: none;
      display: none;
      user-select: none;
    }

    .joystick.show { display: block; }

    .stick-base {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(2px);
    }

    .stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54px;
      height: 54px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255, 209, 102, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.72);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
    }

    @media (max-width: 900px) {
      .hud {
        top: 8px;
        left: 8px;
        padding: 7px 8px;
        gap: 6px;
        font-size: 12px;
      }

      .mobile-tools {
        right: 8px;
        bottom: 8px;
      }

      .mode-btn {
        padding: 8px 10px;
        font-size: 12px;
      }

    }

    @media (orientation: portrait) and (max-width: 900px) {
      /* portrait hint removed */
    }

    .leaderboard-btn,
    .logout-btn {
      z-index: 18;
    }

    .leaderboard-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      height: 40px;
      padding: 0 16px;
      border: 1px solid rgba(255, 209, 102, 0.6);
      border-radius: 6px;
      color: #ffd166;
      background: rgba(3, 22, 42, 0.72);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .leaderboard-btn:hover {
      background: rgba(8, 38, 70, 0.86);
    }

    .logout-btn {
      position: fixed;
      right: 18px;
      bottom: 68px;
      height: 40px;
      padding: 0 16px;
      border: 1px solid rgba(255, 109, 106, 0.75);
      border-radius: 6px;
      color: #ffb3b3;
      background: rgba(40, 8, 16, 0.72);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .logout-btn:hover {
      background: rgba(64, 12, 24, 0.9);
    }

    .account-panel {
      margin: 18px 0 0;
      text-align: left;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .account-panel label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: #ffd166;
    }

    .account-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .account-row select,
    .account-row button {
      min-height: 42px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 14px;
    }

    .account-row select {
      width: 100%;
      padding: 0 12px;
      color: #f3f8ff;
      background: rgba(1, 11, 20, 0.85);
      outline: none;
    }

    .account-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #c4e7ff;
      line-height: 1.45;
    }

    .music-panel-toggle {
      width: 100%;
      margin-top: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 209, 102, 0.5);
      background: rgba(3, 22, 42, 0.9);
      color: #ffd166;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
    }

    .music-controls {
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: left;
      display: none;
    }

    .music-controls.show {
      display: block;
    }

    .music-controls label,
    .music-controls p {
      margin: 6px 0;
      font-size: 13px;
      color: #dcdcdc;
    }

    .music-controls select,
    .music-controls button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 10px 12px;
      font-size: 14px;
      background: rgba(3, 22, 42, 0.95);
      color: #f7f9ff;
    }

    .music-mode-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .music-mode-buttons button {
      flex: 1;
      min-width: 30%;
      background: rgba(255, 255, 255, 0.08);
      color: #c9dfff;
    }

    .music-mode-buttons button.active {
      background: rgba(255, 209, 102, 0.95);
      color: #12212f;
    }

    .music-status {
      margin-top: 10px;
      font-size: 12px;
      color: #b9d2ff;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="top-actions">
    <button id="pauseBtn" class="control-btn" type="button">暂停</button>
    <button id="endBtn" class="control-btn end-btn" type="button">结束</button>
  </div>
  <button id="leaderboardBtn" class="leaderboard-btn" type="button">排行榜</button>
  <button id="logoutBtn" class="logout-btn" type="button">登出</button>

  <div class="hud">
    <div class="tag">分数：<span id="score">0</span></div>
    <div class="tag">体型：<span id="size">22</span></div>
    <div class="tag">血量：<span id="lives">♥♥♥</span></div>
  </div>

  <div class="mobile-tools">
    <button id="modeBtn" class="mode-btn" type="button">横屏+转盘：关</button>
  </div>

  <div id="joystick" class="joystick" aria-hidden="true">
    <div class="stick-base"></div>
    <div id="stick" class="stick"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h1 id="title">大鱼吃小鱼</h1>
      <p id="msg">准备好开始了吗？</p>
          <div class="account-panel" id="accountPanel">
        <label for="accountSelect">快速切换账号</label>
        <div class="account-row">
          <select id="accountSelect">
            <option value="">选择已保存账号</option>
          </select>
          <button id="accountSwitchBtn" class="secondary-btn" type="button" disabled>登录</button>
        </div>
        <p id="accountHint" class="account-hint">如果已保存账号，可在此直接登录后开始游戏。</p>
      </div>
      <button id="musicToggleBtn" class="music-panel-toggle" type="button">音乐设置</button>
      <div class="music-controls" id="musicControls">
        <label for="musicSelect">选择音乐栏位</label>
        <select id="musicSelect"></select>
        <button id="musicPlayBtn" type="button">播放选中音乐</button>
        <div class="music-mode-buttons">
          <button id="modeSequential" type="button" class="active">顺序</button>
          <button id="modeRandom" type="button">随机</button>
          <button id="modeLoop" type="button">循环</button>
        </div>
        <p class="music-status" id="musicStatus">准备播放音乐。</p>
      </div>
      <div class="card-actions">
        <button id="btn" type="button">开始游戏</button>
        <button id="overlayLeaderboardBtn" class="secondary-btn" type="button">排行榜</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { uploadScore, login } from './js/api.js';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const fishImage = new Image();
    fishImage.src = './assets/fish.png';
    const playerFishSprite = { x: 68, y: 332, width: 78, height: 64 };
    const fishSprites = {
      round: { x: 154, y: 12, width: 66, height: 65 },
      stripe: { x: 388, y: 21, width: 74, height: 48 },
      needle: { x: 714, y: 20, width: 66, height: 48 },
      angel: { x: 230, y: 92, width: 74, height: 61 },
      box: { x: 470, y: 105, width: 71, height: 42 },
      puffer: { x: 233, y: 252, width: 68, height: 65 },
      koi: { x: 470, y: 332, width: 72, height: 61 },
      manta: { x: 548, y: 180, width: 74, height: 50 },
      dart: { x: 230, y: 505, width: 71, height: 41 },
      shark: { x: 629, y: 580, width: 75, height: 48 }
    };

    const scoreEl = document.getElementById('score');
    const sizeEl = document.getElementById('size');
    const livesEl = document.getElementById('lives');
    const leaderboardBtn = document.getElementById('leaderboardBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const endBtn = document.getElementById('endBtn');
    const accountPanel = document.getElementById('accountPanel');
    const accountSelect = document.getElementById('accountSelect');
    const accountSwitchBtn = document.getElementById('accountSwitchBtn');
    const accountHint = document.getElementById('accountHint');
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const musicControls = document.getElementById('musicControls');
    const musicSelect = document.getElementById('musicSelect');
    const musicPlayBtn = document.getElementById('musicPlayBtn');
    const modeSequential = document.getElementById('modeSequential');
    const modeRandom = document.getElementById('modeRandom');
    const modeLoop = document.getElementById('modeLoop');
    const musicStatus = document.getElementById('musicStatus');
    const overlayLeaderboardBtn = document.getElementById('overlayLeaderboardBtn');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const msgEl = document.getElementById('msg');
    const btn = document.getElementById('btn');
    const modeBtn = document.getElementById('modeBtn');
    const joystickEl = document.getElementById('joystick');
    const stickEl = document.getElementById('stick');

    const isTouchDevice = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
    const fishTypes = ['round', 'stripe', 'needle', 'angel', 'box', 'puffer', 'koi', 'manta', 'dart'];

    const state = {
      width: window.innerWidth,
      height: window.innerHeight,
      running: false,
      score: 0,
      lives: 3,
      invincibleUntil: 0,
      spawnTick: 0,
      targetX: window.innerWidth * 0.5,
      targetY: window.innerHeight * 0.5,
      fish: [],
      bubbles: [],
      mobileMode: false,
      paused: false,
      joystick: {
        engaged: false,
        pointerId: null,
        inputX: 0,
        inputY: 0,
        maxRadius: 42
      },
      keys: {
        w: false,
        a: false,
        s: false,
        d: false,
        arrowup: false,
        arrowleft: false,
        arrowdown: false,
        arrowright: false
      }
    };

    leaderboardBtn.addEventListener('click', () => {
      window.location.href = 'leaderboard.html';
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      window.location.href = 'login.html';
    });

    pauseBtn.addEventListener('click', () => {
      if (!state.running) return;
      state.paused = !state.paused;
      pauseBtn.textContent = state.paused ? '继续' : '暂停';
      if (state.paused) {
        musicStatus.textContent = '游戏已暂停，背景音乐继续播放。';
      } else {
        musicStatus.textContent = '继续游戏。';
      }
    });

    endBtn.addEventListener('click', () => {
      if (!state.running) return;
      state.paused = false;
      pauseBtn.textContent = '暂停';
      endGame();
    });

    const musicTracks = [
      { label: 'Bub8les - Time Paradox', file: 'Bub8les _ RazorFrost _ Rare - Time Paradox With Lyrics _ Undertale (feat_ RazorFrost & Rare).mp4' },
      { label: 'Silver Lake', file: "Dan Gibson's Solitudes - Silver Lake_H.ogg" },
      { label: 'Clear skies beyond the storm', file: 'eugenio izzi - Clear skies beyond the storm_H.ogg' },
      { label: 'You Ballin In The Wrong Neighborhood', file: 'Exsire - You Ballin In The Wrong Neighborhood (No Jumpscare Ending since a lot of people asked me to release a version without ballin at the end, so here it is)_H.mp4' },
      { label: 'Braniac Maniac', file: 'Laura Shigihara - Braniac Maniac_L.ogg' },
      { label: 'Aruarian Dance', file: 'Nujabes _ Fat Jon - Aruarian Dance.flac' },
      { label: 'Before the Story', file: 'Toby Fox - Before the Story.flac' },
      { label: 'Перемотка - Встречная', file: 'Перемотка - Встречная_L.ogg' },
      { label: 'Misty Memory', file: '塞壬唱片-MSR _ Elvin Shen _ ZT _ Erik Castro _ David Lin _ 左乙 - Misty Memory (Night Version)_L.ogg' },
      { label: 'No Bet, No Life', file: '塞壬唱片-MSR _ N2V - No Bet, No Life.flac' }
    ];

    const audio = new Audio();
    audio.preload = 'metadata';
    let currentTrackIndex = 0;
    let musicMode = 'sequential';

    function setMusicMode(mode) {
      musicMode = mode;
      modeSequential.classList.toggle('active', mode === 'sequential');
      modeRandom.classList.toggle('active', mode === 'random');
      modeLoop.classList.toggle('active', mode === 'loop');
      musicStatus.textContent = `播放模式：${mode === 'sequential' ? '顺序' : mode === 'random' ? '随机' : '循环'}。`;
    }

    function populateMusicSelect() {
      musicSelect.innerHTML = musicTracks.map((track, index) => `
        <option value="${index}">${index + 1}. ${track.label}</option>
      `).join('');
    }

    function getTrackUrl(track) {
      return `/music/${encodeURIComponent(track.file)}`;
    }

    function playMusic(index) {
      if (typeof index !== 'number' || index < 0 || index >= musicTracks.length) {
        return;
      }
      currentTrackIndex = index;
      audio.src = getTrackUrl(musicTracks[currentTrackIndex]);
      audio.play().catch(() => {
        musicStatus.textContent = '无法播放音乐，请检查浏览器是否允许自动播放或音频文件是否已加载。';
      });
      musicStatus.textContent = `正在播放：${musicTracks[currentTrackIndex].label}`;
      musicSelect.value = String(currentTrackIndex);
    }

    function selectNextTrack() {
      if (musicMode === 'loop') {
        return currentTrackIndex;
      }
      if (musicMode === 'random') {
        const next = Math.floor(Math.random() * musicTracks.length);
        return next === currentTrackIndex ? (currentTrackIndex + 1) % musicTracks.length : next;
      }
      return (currentTrackIndex + 1) % musicTracks.length;
    }

    audio.addEventListener('ended', () => {
      const nextIndex = selectNextTrack();
      playMusic(nextIndex);
    });

    musicToggleBtn.addEventListener('click', () => {
      const showing = musicControls.classList.toggle('show');
      btn.disabled = showing;
      musicToggleBtn.textContent = showing ? '关闭音乐设置' : '音乐设置';
      if (showing) {
        musicStatus.textContent = '请选择一个音乐栏位并播放。';
      } else {
        musicStatus.textContent = '音乐设置已关闭。';
      }
    });

    musicPlayBtn.addEventListener('click', () => {
      const selectedIndex = parseInt(musicSelect.value, 10);
      if (Number.isNaN(selectedIndex)) {
        musicStatus.textContent = '请选择要播放的音乐。';
        return;
      }
      playMusic(selectedIndex);
    });

    musicSelect.addEventListener('change', () => {
      const selectedIndex = parseInt(musicSelect.value, 10);
      if (!Number.isNaN(selectedIndex)) {
        musicStatus.textContent = `已选择：${musicTracks[selectedIndex].label}`;
      }
    });

    modeSequential.addEventListener('click', () => setMusicMode('sequential'));
    modeRandom.addEventListener('click', () => setMusicMode('random'));
    modeLoop.addEventListener('click', () => setMusicMode('loop'));

    populateMusicSelect();
    setMusicMode('sequential');

    accountSelect.addEventListener('change', () => {
      accountSwitchBtn.disabled = !accountSelect.value;
      if (accountSelect.value) {
        accountHint.textContent = `准备登录：${accountSelect.value}`;
      } else {
        const active = localStorage.getItem('username');
        accountHint.textContent = active
          ? `当前账号：${active}。选择已保存账号即可快速切换。`
          : '如果已保存账号，可在此直接登录后开始游戏。';
      }
    });

    accountSwitchBtn.addEventListener('click', async () => {
      const selected = accountSelect.value;
      if (!selected) return;
      const savedAccounts = loadSavedAccounts();
      const account = savedAccounts.find((item) => item.username === selected);
      if (!account) {
        accountHint.textContent = '未找到已保存账号，请在登录页重新登录一次。';
        return;
      }

      accountSwitchBtn.disabled = true;
      accountHint.textContent = `正在登录 ${selected}...`;
      try {
        await login(account.username, account.password);
        accountHint.textContent = `已登录：${account.username}，现在可直接开始游戏。`;
      } catch (err) {
        accountHint.textContent = err.message || '登录失败，请检查账号信息。';
      } finally {
        accountSwitchBtn.disabled = false;
      }
    });

    overlayLeaderboardBtn.addEventListener('click', () => {
      window.location.href = 'leaderboard.html';
    });

    const player = {
      x: state.width * 0.5,
      y: state.height * 0.5,
      r: 22,
      speed: 2.5,
      color: '#ffe08a'
    };

    function resize() {
      state.width = window.innerWidth;
      state.height = window.innerHeight;
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(state.width * dpr);
      canvas.height = Math.floor(state.height * dpr);
      canvas.style.width = state.width + 'px';
      canvas.style.height = state.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function loadSavedAccounts() {
      try {
        return JSON.parse(localStorage.getItem('savedAccounts')) || [];
      } catch (err) {
        return [];
      }
    }

    function renderAccountSwitcher() {
      const accounts = loadSavedAccounts();
      if (!accounts.length) {
        accountPanel.style.display = 'none';
        return;
      }

      accountPanel.style.display = 'block';
      const currentUser = localStorage.getItem('username');
      accountSelect.innerHTML = [
        '<option value="">选择已保存账号</option>',
        ...accounts.map((account) => `
          <option value="${account.username}">${account.username}</option>
        `)
      ].join('');
      accountSwitchBtn.disabled = true;
      accountHint.textContent = currentUser
        ? `当前账号：${currentUser}。选择已保存账号即可快速切换。`
        : '如果已保存账号，可在此直接登录后开始游戏。';
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function spawnFish() {
      if (!state.running) return;
      const maxFishOnScreen = 12;
      if (state.fish.length >= maxFishOnScreen) return;

      const side = Math.floor(Math.random() * 4);
      const spawnShark = state.score >= 350 && Math.random() < 0.18;
      const minR = spawnShark ? player.r * 0.9 : Math.max(7, player.r * 0.28);
      const maxR = spawnShark ? player.r * 1.15 : Math.max(14, player.r * 1.08);
      const r = rand(minR, maxR);
      const speed = clamp(rand(0.45, 0.95) * (24 / Math.max(18, r)), 0.38, 0.95);
      const drift = clamp(speed * 0.45, 0.16, 0.34);
      let x;
      let y;
      let vx;
      let vy;

      if (side === 0) {
        x = -r;
        y = rand(0, state.height);
        vx = speed;
        vy = rand(-drift, drift);
      } else if (side === 1) {
        x = state.width + r;
        y = rand(0, state.height);
        vx = -speed;
        vy = rand(-drift, drift);
      } else if (side === 2) {
        x = rand(0, state.width);
        y = -r;
        vx = rand(-drift, drift);
        vy = speed;
      } else {
        x = rand(0, state.width);
        y = state.height + r;
        vx = rand(-drift, drift);
        vy = -speed;
      }

      state.fish.push({
        x,
        y,
        r,
        vx,
        vy,
        hue: Math.floor(rand(0, 360)),
        wiggle: rand(0, Math.PI * 2),
        type: spawnShark ? 'shark' : fishTypes[Math.floor(rand(0, fishTypes.length))]
      });
    }

    function spawnBubble() {
      if (state.bubbles.length > 60) return;
      state.bubbles.push({
        x: rand(0, state.width),
        y: state.height + rand(0, 150),
        r: rand(1.5, 5),
        vy: rand(0.3, 1.3),
        alpha: rand(0.15, 0.45)
      });
    }

    function movePlayer() {
      const baseSpeed = player.speed * clamp(24 / Math.max(24, player.r), 0.8, 1);
      const joystickScale = state.mobileMode ? 0.88 : 1;
      const s = baseSpeed * joystickScale;
      const joy = state.joystick;

      if (state.mobileMode && (Math.abs(joy.inputX) > 0.05 || Math.abs(joy.inputY) > 0.05)) {
        player.x += joy.inputX * s;
        player.y += joy.inputY * s;
        state.targetX = player.x;
        state.targetY = player.y;
      } else {
        const left = state.keys.a || state.keys.arrowleft;
        const right = state.keys.d || state.keys.arrowright;
        const up = state.keys.w || state.keys.arrowup;
        const down = state.keys.s || state.keys.arrowdown;
        const hasKeyboardInput = left || right || up || down;

        if (hasKeyboardInput) {
          let inputX = (right ? 1 : 0) - (left ? 1 : 0);
          let inputY = (down ? 1 : 0) - (up ? 1 : 0);
          const inputLen = Math.hypot(inputX, inputY);
          if (inputLen > 0) {
            inputX /= inputLen;
            inputY /= inputLen;
            player.x += inputX * s;
            player.y += inputY * s;
            state.targetX = player.x;
            state.targetY = player.y;
          }
        } else {
          const dx = state.targetX - player.x;
          const dy = state.targetY - player.y;
          const d = Math.hypot(dx, dy);
          if (d > 0.1) {
            player.x += (dx / d) * Math.min(d, s);
            player.y += (dy / d) * Math.min(d, s);
          }
        }
      }

      player.x = clamp(player.x, player.r, state.width - player.r);
      player.y = clamp(player.y, player.r, state.height - player.r);
    }

    function updateFish() {
      for (let i = state.fish.length - 1; i >= 0; i--) {
        const f = state.fish[i];
        f.x += f.vx;
        f.y += f.vy;
        f.wiggle += 0.12;

        if (f.x < -100 || f.x > state.width + 100 || f.y < -100 || f.y > state.height + 100) {
          state.fish.splice(i, 1);
          continue;
        }

        const hit = dist(player, f) <= player.r + f.r;
        if (!hit) continue;

        if (player.r >= f.r * 1.02) {
          state.score += scoreForFish(f);
          const area = player.r * player.r + f.r * f.r * 0.08;
          player.r = Math.min(110, Math.sqrt(area));
          state.fish.splice(i, 1);
        } else if (performance.now() >= state.invincibleUntil) {
          state.lives -= 1;
          state.invincibleUntil = performance.now() + 900;
          renderHud();
          if (state.lives <= 0) {
            endGame();
            return;
          }
        }
      }
    }

    function scoreForFish(f) {
      if (f.type === 'shark') {
        return Math.max(12, Math.floor(f.r / 3));
      }
      return Math.max(1, Math.floor((f.r - 7) / 8) + 1);
    }

    function updateBubbles() {
      for (let i = state.bubbles.length - 1; i >= 0; i--) {
        const b = state.bubbles[i];
        b.y -= b.vy;
        if (b.y < -20) state.bubbles.splice(i, 1);
      }
    }

    function drawNpcFish(f) {
      const facing = f.vx >= 0 ? 1 : -1;
      const r = f.r;

      ctx.save();
      ctx.translate(f.x, f.y);
      if (facing < 0) ctx.scale(-1, 1);
      drawSpriteFish(fishSprites[f.type] || fishSprites.round, r * 2.9, r * 1.8);
      ctx.restore();
    }

    function drawPlayerFish() {
      const keyboardDirX = (state.keys.d || state.keys.arrowright ? 1 : 0)
        - (state.keys.a || state.keys.arrowleft ? 1 : 0);
      const dirX = keyboardDirX !== 0
        ? keyboardDirX
        : state.mobileMode && Math.abs(state.joystick.inputX) > 0.05
          ? state.joystick.inputX
          : state.targetX - player.x;
      const facing = dirX >= 0 ? 1 : -1;
      const r = player.r;

      ctx.save();
      ctx.translate(player.x, player.y);
      if (facing < 0) ctx.scale(-1, 1);
      drawSpriteFish(playerFishSprite, r * 2.8, r * 2.25);
      ctx.restore();
    }

    function drawSpriteFish(sprite, width, height) {
      if (!fishImage.complete) return;
      ctx.drawImage(
        fishImage,
        sprite.x,
        sprite.y,
        sprite.width,
        sprite.height,
        -width / 2,
        -height / 2,
        width,
        height
      );
    }

    function draw() {
      ctx.clearRect(0, 0, state.width, state.height);

      for (const b of state.bubbles) {
        ctx.fillStyle = `rgba(214,245,255,${b.alpha})`;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const f of state.fish) {
        drawNpcFish(f);
      }

      drawPlayerFish();
    }

    function renderHud() {
      scoreEl.textContent = String(state.score);
      sizeEl.textContent = player.r.toFixed(1);
      livesEl.textContent = '♥'.repeat(Math.max(0, state.lives));
    }

    function resetGame() {
      state.score = 0;
      state.lives = 3;
      state.invincibleUntil = 0;
      state.spawnTick = 0;
      state.fish = [];
      state.bubbles = [];
      Object.keys(state.keys).forEach((key) => { state.keys[key] = false; });
      resetJoystick();
      player.r = 22;
      player.x = state.width * 0.5;
      player.y = state.height * 0.5;
      state.targetX = player.x;
      state.targetY = player.y;
      renderHud();
    }

    function startGame() {
      resetGame();
      state.paused = false;
      pauseBtn.textContent = '暂停';
      state.running = true;
      overlay.classList.remove('show');
    }

    function endGame() {
      state.running = false;
      titleEl.textContent = '游戏结束';
      msgEl.innerHTML = `最终分数：<b>${state.score}</b><br>当前体型：<b>${player.r.toFixed(1)}</b>`;
      const token = localStorage.getItem('token');

      const finalScore = state.score;
      const currentSize = player.r.toFixed(1);
      btn.textContent = '再来一局';
      overlayLeaderboardBtn.textContent = '排行榜';
      overlayLeaderboardBtn.style.display = 'inline-flex';
      btn.disabled = true;
      overlayLeaderboardBtn.disabled = true;
      btn.onclick = startGame;
      overlayLeaderboardBtn.onclick = () => window.location.href = 'leaderboard.html';

      if (token) {
        titleEl.textContent = '上传中...';
        msgEl.innerHTML = `最终分数：<b>${finalScore}</b><br>当前体型：<b>${currentSize}</b><br>正在自动上传分数...`;

        uploadScore(finalScore)
          .then(() => {
            titleEl.textContent = '上传成功';
            msgEl.innerHTML = `最终分数：<b>${finalScore}</b><br>当前体型：<b>${currentSize}</b><br>分数已上传，点击下方开始新游戏。`;
          })
          .catch((err) => {
            titleEl.textContent = '上传失败';
            msgEl.innerHTML = `最终分数：<b>${finalScore}</b><br>当前体型：<b>${currentSize}</b><br>${err.message || '上传失败，请稍后重试。'}`;
          })
          .finally(() => {
            btn.disabled = false;
            overlayLeaderboardBtn.disabled = false;
          });
      } else {
        titleEl.textContent = '游戏结束';
        msgEl.innerHTML = `最终分数：<b>${finalScore}</b><br>当前体型：<b>${currentSize}</b><br>未登录时分数不会自动上传，登录后可自动上传。`;
        btn.disabled = false;
        overlayLeaderboardBtn.disabled = false;
      }

      renderAccountSwitcher();
      overlay.classList.add('show');
    }

    function showNormalStartOverlay() {
      titleEl.textContent = '大鱼吃小鱼';
      msgEl.textContent = '准备好开始了吗？';
      renderAccountSwitcher();
      musicControls.classList.remove('show');
      musicToggleBtn.textContent = '音乐设置';
      btn.disabled = false;
      btn.textContent = '开始游戏';
      overlay.classList.add('show');
    }

    function loop() {
      if (state.running && !state.paused) {
        state.spawnTick -= 1;
        if (state.spawnTick <= 0) {
          spawnFish();
          state.spawnTick = Math.max(18, Math.floor(Math.random() * 24 + 34));
        }
        if (Math.random() < 0.35) spawnBubble();

        movePlayer();
        updateFish();
        updateBubbles();
        renderHud();
      } else if (!state.running) {
        updateBubbles();
        if (Math.random() < 0.2) spawnBubble();
      }

      draw();
      requestAnimationFrame(loop);
    }

    function setTarget(clientX, clientY) {
      state.targetX = clamp(clientX, 0, state.width);
      state.targetY = clamp(clientY, 0, state.height);
    }

    function resetJoystick() {
      state.joystick.engaged = false;
      state.joystick.pointerId = null;
      state.joystick.inputX = 0;
      state.joystick.inputY = 0;
      stickEl.style.transform = 'translate(-50%, -50%)';
    }

    function updateJoystickFromPoint(clientX, clientY) {
      const rect = joystickEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const d = Math.hypot(dx, dy);
      const maxR = state.joystick.maxRadius;

      let nx = 0;
      let ny = 0;
      let drawX = 0;
      let drawY = 0;

      if (d > 0.0001) {
        const use = Math.min(d, maxR);
        nx = dx / d;
        ny = dy / d;
        drawX = nx * use;
        drawY = ny * use;
      }

      state.joystick.inputX = Math.max(-1, Math.min(1, drawX / maxR));
      state.joystick.inputY = Math.max(-1, Math.min(1, drawY / maxR));
      stickEl.style.transform = `translate(calc(-50% + ${drawX}px), calc(-50% + ${drawY}px))`;
    }

    function setMobileMode(on) {
      state.mobileMode = on;
      document.body.classList.toggle('mobile-mode', on);
      modeBtn.classList.toggle('active', on);
      modeBtn.textContent = on ? '横屏+转盘：开' : '横屏+转盘：关';
      joystickEl.classList.toggle('show', on);
      if (!on) resetJoystick();
    }

    async function requestLandscapeAndFullscreen() {
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {
      }

      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (e) {
      }
    }

    window.addEventListener('mousemove', (e) => {
      if (!state.mobileMode) setTarget(e.clientX, e.clientY);
    });

    window.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (!t) return;
      if (state.mobileMode) return;
      setTarget(t.clientX, t.clientY);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if (!t) return;
      if (state.mobileMode) return;
      setTarget(t.clientX, t.clientY);
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (Object.prototype.hasOwnProperty.call(state.keys, key)) {
        state.keys[key] = true;
      }
      if (key.startsWith('arrow')) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (Object.prototype.hasOwnProperty.call(state.keys, key)) {
        state.keys[key] = false;
      }
    });

    joystickEl.addEventListener('pointerdown', (e) => {
      if (!state.mobileMode) return;
      state.joystick.engaged = true;
      state.joystick.pointerId = e.pointerId;
      joystickEl.setPointerCapture(e.pointerId);
      updateJoystickFromPoint(e.clientX, e.clientY);
      e.preventDefault();
    });

    joystickEl.addEventListener('pointermove', (e) => {
      if (!state.mobileMode) return;
      if (!state.joystick.engaged || state.joystick.pointerId !== e.pointerId) return;
      updateJoystickFromPoint(e.clientX, e.clientY);
      e.preventDefault();
    });

    function releaseJoystick(e) {
      if (!state.joystick.engaged || state.joystick.pointerId !== e.pointerId) return;
      resetJoystick();
    }

    joystickEl.addEventListener('pointerup', releaseJoystick);
    joystickEl.addEventListener('pointercancel', releaseJoystick);
    joystickEl.addEventListener('pointerleave', releaseJoystick);

    window.addEventListener('blur', () => {
      Object.keys(state.keys).forEach((key) => { state.keys[key] = false; });
      resetJoystick();
    });

    window.addEventListener('resize', resize);

    modeBtn.addEventListener('click', async () => {
      const next = !state.mobileMode;
      setMobileMode(next);
      if (next) await requestLandscapeAndFullscreen();
    });

    btn.onclick = startGame;

    if (!isTouchDevice) {
      modeBtn.style.display = 'none';
    }
    setMobileMode(false);
    showNormalStartOverlay();
    resize();
    renderHud();
    loop();
  </script>
</body>
</html>
