<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深海鱼战 - 登录</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            color: #eaf6ff;
            background:
                    radial-gradient(circle at 20% 15%, rgba(74, 160, 210, 0.28), transparent 28%),
                    radial-gradient(circle at 80% 85%, rgba(255, 209, 102, 0.12), transparent 24%),
                    linear-gradient(180deg, #06213f 0%, #03101f 100%);
            overflow: hidden;
        }

        .login-box {
            width: min(360px, calc(100vw - 32px));
            padding: 34px 28px 28px;
            border: 1px solid rgba(150, 215, 255, 0.22);
            border-radius: 8px;
            background: rgba(3, 22, 42, 0.82);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
        }

        h1 {
            margin: 0 0 6px;
            text-align: center;
            font-size: 28px;
            letter-spacing: 0;
            color: #ffd166;
        }

        .subtitle {
            margin: 0 0 26px;
            text-align: center;
            font-size: 14px;
            color: #9fc9e8;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-size: 14px;
            color: #c8e8ff;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 0 13px;
            border: 1px solid rgba(159, 201, 232, 0.36);
            border-radius: 6px;
            outline: none;
            color: #ffffff;
            background: rgba(1, 13, 26, 0.72);
            font-size: 15px;
        }

        input:focus {
            border-color: #ffd166;
            box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.16);
        }

        button {
            width: 100%;
            height: 44px;
            margin-top: 22px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            color: #09213d;
            background: #ffd166;
            font-size: 16px;
            font-weight: 700;
        }

        button:hover {
            background: #ffdc85;
        }

        .link {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #9fc9e8;
        }

        .link a {
            color: #ffd166;
            text-decoration: none;
            font-weight: 700;
        }

        .message {
            margin-top: 14px;
            min-height: 22px;
            font-size: 14px;
            text-align: center;
        }

        .fish {
            position: fixed;
            color: rgba(255, 255, 255, 0.18);
            font-size: 42px;
            pointer-events: none;
        }

        .fish.one {
            left: 10%;
            top: 18%;
        }

        .fish.two {
            right: 12%;
            bottom: 16%;
            transform: scaleX(-1);
        }
    </style>
</head>
<body>
<div class="fish one">&gt;&lt;&gt;</div>
<div class="fish two">&gt;&lt;&gt;</div>

<main class="login-box">
    <h1>深海鱼战</h1>
    <p class="subtitle">登录后开始大鱼吃小鱼</p>

    <form id="loginForm">
        <label for="username">用户名</label>
        <input id="username" type="text" autocomplete="username" required>

        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button type="submit">登录</button>
    </form>
    <div id="message" class="message"></div>

    <div class="link">
        没有账号？<a href="register.html">去注册</a>
    </div>
</main>

<script type="module">
    import { login } from './js/api.js';

    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const messageEl = document.getElementById('message');

    function setMessage(text, type = 'info') {
        messageEl.textContent = text;
        messageEl.style.color = type === 'error' ? '#ff8c8c' : '#a8ffb9';
    }

    const savedUsername = sessionStorage.getItem('registerUsername');
    const savedPassword = sessionStorage.getItem('registerPassword');
    if (savedUsername) {
        usernameInput.value = savedUsername;
        passwordInput.value = savedPassword || '';
        sessionStorage.removeItem('registerUsername');
        sessionStorage.removeItem('registerPassword');
        setMessage('已填写注册信息，请登录。', 'success');
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        if (!username || !password) {
            setMessage('用户名和密码不能为空', 'error');
            return;
        }

        try {
            await login(username, password);
            setMessage('登录成功，正在进入游戏...', 'success');
            setTimeout(() => {
                window.location.href = 'game.html';
            }, 600);
        } catch (err) {
            setMessage(err.message || '登录失败', 'error');
        }
    });
</script>
</body>
</html>
